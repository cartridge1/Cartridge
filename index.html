<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>كارتريدج | Cartridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;800&display=swap">
<style>
:root{--bg:#f2efe8;--sf:#fffdf8;--fg:#0e0e14;--mu:#69665e;--ln:#ddd8ca;--ac:#ff4d1c;--on:#fff;--ac2:#3a2bff;color-scheme:light}

body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 Rubik,system-ui,sans-serif;padding-top:env(safe-area-inset-top);overflow-x:hidden}

.wrap{max-width:1180px;margin:auto;padding:0 20px}

.cart{width:112px;animation:ins 1.2s cubic-bezier(.3,1.3,.5,1) both}
.slot{width:160px;height:16px;border-radius:8px;background:#1d1d2b;margin-top:-18px;position:relative;animation:glow .5s 1.1s both}

#intro .lg span:nth-child(odd){color:#c6ff3d}
@keyframes pop{to{opacity:1;transform:none}}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px)}
.bar2{display:flex;align-items:center;gap:8px;height:66px}

.ib{height:42px;min-width:42px;padding:0 14px;border-radius:99px;border:1.5px solid var(--fg);background:transparent;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.ib:hover{background:var(--fg);color:var(--bg)}
.wa{background:var(--ac);color:var(--on);border-color:var(--ac)}.wa:hover{background:var(--ac);color:var(--on);filter:brightness(1.1)}
.mb{display:inline-flex;flex-direction:column;gap:4px}.mb i{display:block;width:18px;height:2px;background:currentColor;border-radius:2px}.mb i+i{width:12px}
.mh{display:flex;justify-content:space-between;align-items:center;height:66px;max-width:1180px;margin:auto}

.hh{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;padding:40px 0 30px}

.hh p{color:var(--mu);font-size:18px;max-width:520px;margin:0 0 24px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 26px;border-radius:99px;background:var(--ac);color:var(--on);font-weight:700;border:0;transition:.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.o{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{font-size:13px;padding:4px 14px;border:1px solid var(--ln);border-radius:99px;color:var(--mu)}
.stack{position:relative;height:340px}
.fc{position:absolute;width:230px;padding:18px;border-radius:20px;background:var(--sf);border:1.5px solid var(--fg);box-shadow:8px 8px 0 var(--fg);animation:fl 5s ease-in-out infinite;direction:ltr}
.fc small{font-size:11px;letter-spacing:.12em;color:var(--mu);font-weight:600}.fc b{display:block;font-size:40px;line-height:1.1;font-weight:800}

.fc:nth-child(2){top:100px;inset-inline-end:2%;transform:rotate(6deg) translate(calc(var(--px,0)*-18px),calc(var(--py,0)*-12px));background:var(--ac);color:var(--on);animation-delay:-1.6s}.fc:nth-child(2) small{color:inherit;opacity:.7}
.fc:nth-child(3){top:210px;inset-inline-start:14%;transform:rotate(-2deg) translate(calc(var(--px,0)*10px),calc(var(--py,0)*-14px));animation-delay:-3.2s}
@keyframes fl{50%{translate:0 -14px}}

.bento{display:grid;gap:14px;grid-template-columns:repeat(4,1fr);grid-auto-rows:190px}
.offer{border-radius:24px;padding:24px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;transition:.3s;border:1.5px solid var(--fg)}
.offer:nth-child(1){grid-column:span 2;grid-row:span 2;background:linear-gradient(150deg,#ff4d1c,#b3125e)}
.offer:nth-child(2){grid-column:span 2;background:linear-gradient(135deg,#2b3cff,#7a3bff)}
.offer:nth-child(3){background:#0f8f6d}.offer:nth-child(4){background:#15151f}
.offer:hover{transform:translateY(-6px) rotate(-.6deg)}
.offer .big{position:absolute;top:-10px;inset-inline-end:14px;font-size:150px;font-weight:800;line-height:1;opacity:.18;direction:ltr}
.offer:nth-child(1) .big{font-size:300px}
.offer .bd{align-self:flex-start;background:#fff;color:#111;font-size:12px;font-weight:700;padding:1px 12px;border-radius:99px;margin-bottom:8px}
.offer b{font-size:22px;line-height:1.2}.offer:nth-child(1) b{font-size:34px}.offer span{font-size:14px;opacity:.9}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 16px;scrollbar-width:thin}
.rail .tk{min-width:250px;scroll-snap-align:start}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{background:var(--sf);border:1.5px solid var(--ln);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:2px;transition:.25s}
.tile:hover{border-color:var(--fg);box-shadow:6px 6px 0 var(--ac);transform:translate(-3px,-3px)}
.tile .ic{font-weight:800;font-size:34px;line-height:1;margin-bottom:12px;direction:ltr;color:var(--ac)}

.cty{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.cty button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.note,.sub{color:var(--mu);font-size:14px;margin:0 0 16px}
.tk{background:var(--sf);border:1.5px solid var(--ln);border-radius:20px;overflow:hidden;opacity:0;animation:up .5s forwards;animation-delay:calc(var(--i)*.05s);transition:.25s}
.tk:hover{border-color:var(--fg);transform:translateY(-4px)}
.tk .t{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tg{font-size:12px;font-weight:600;background:var(--bg);padding:2px 11px;border-radius:99px;margin-inline-end:4px;color:var(--mu)}
.am{font-size:30px;font-weight:800;direction:ltr;letter-spacing:-.02em}.am.g{font-size:17px}
.pf{border-top:2px dashed var(--ln);position:relative}
.pf:before,.pf:after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1.5px solid var(--ln)}
.pf:before{inset-inline-start:-10px}.pf:after{inset-inline-end:-10px}
.tk .b{padding:14px 18px 18px}.tk h3{margin:0;font-size:17px}.tk p{margin:0 0 10px;color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pr{font-size:21px;font-weight:800}.pr small{font-size:11px;font-weight:500;color:var(--mu)}.pr.ask{font-size:14px;color:var(--mu);font-weight:500}
.row .btn{min-height:38px;padding:0 18px;font-size:14px}
.sl2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sl2 button{padding:3px 12px;border-radius:99px;border:1.5px solid var(--ln);background:transparent;font-size:13px}
.sl2 button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input.q{width:100%;max-width:400px;height:46px;border-radius:99px;border:1.5px solid var(--fg);background:var(--sf);color:var(--fg);padding:0 20px;margin-bottom:16px;font:inherit}
.steps{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));counter-reset:s;padding:0;list-style:none}
.steps li{border-top:2px solid var(--fg);padding-top:14px;counter-increment:s}
.steps li:before{content:"0" counter(s);font-weight:800;font-size:48px;line-height:1;color:var(--ac);display:block;direction:ltr;text-align:start}
.steps b{display:block;font-size:18px}.steps span{color:var(--mu);font-size:14px}
details{border-bottom:1px solid var(--ln);padding:14px 0}
summary{font-weight:600;cursor:pointer;font-size:17px}details p{margin:8px 0 0;color:var(--mu)}
footer{margin-top:80px;background:var(--fg);color:var(--bg);padding:44px 0 100px}
footer .wrap{display:flex;gap:24px;flex-wrap:wrap;justify-content:space-between}
footer p{opacity:.7;margin:4px 0}
.fl{position:fixed;bottom:18px;inset-inline-end:18px;z-index:20;box-shadow:0 8px 22px #0005;min-height:52px}
.back{display:inline-block;margin:24px 0 0;color:var(--ac);font-weight:600}
.rv{opacity:0;transform:translateY(30px);transition:.7s}.rv.in{opacity:1;transform:none}
@media(max-width:820px){.hh{grid-template-columns:1fr}.stack{height:300px}.bento{grid-template-columns:1fr 1fr}.offer:nth-child(1){grid-column:span 2}.offer:nth-child(2){grid-column:span 2}.offer:nth-child(1) .big{font-size:200px}}

[hidden]{display:none!important}
.cartb{position:fixed;bottom:18px;inset-inline-start:18px;z-index:20;min-height:52px;background:var(--fg);color:var(--bg);box-shadow:0 8px 22px #0005;font-size:18px}
.cartb b{background:var(--ac);color:var(--on);border-radius:99px;min-width:22px;height:22px;font-size:12px;display:grid;place-items:center;padding:0 5px}
.cartb.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.25) rotate(-8deg)}}
#cp{position:fixed;inset:0;z-index:90;visibility:hidden;transition:visibility 0s .5s}#cp.open{visibility:visible;transition:none}
#cp .cb{position:absolute;inset:0;background:#000a;opacity:0;transition:.4s}#cp.open .cb{opacity:1}
#cp .cc{position:absolute;bottom:0;left:0;right:0;max-width:540px;margin:auto;background:var(--sf);border:1.5px solid var(--fg);border-bottom:0;border-radius:24px 24px 0 0;padding:20px;max-height:86vh;overflow:auto;transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.9,.2,1)}
#cp.open .cc{transform:none}
.ci{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.ci span{flex:1;font-weight:500}.ci b{white-space:nowrap}.ci button{border:0;background:none;font-size:18px;color:var(--mu)}
#cnote{width:100%;margin:12px 0;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);color:var(--fg);padding:10px 14px;font:inherit;min-height:64px;resize:vertical}
.ctot{font-weight:800;font-size:22px;margin-bottom:12px}
.btn.ad{padding:0;min-width:38px;justify-content:center;font-size:18px}
#sr{position:fixed;inset:0;z-index:70;background:var(--bg);clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path .6s cubic-bezier(.77,0,.18,1),visibility 0s .6s;overflow:auto;padding:0 20px 40px}
#sr.open{clip-path:inset(0);visibility:visible;transition:clip-path .6s cubic-bezier(.77,0,.18,1)}
.srw{max-width:760px;margin:20px auto}.srw input{max-width:none;height:60px;font-size:20px}
.sr{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}.sr>a:first-child{flex:1;min-width:160px;font-weight:600}
.pz s{opacity:.7}.pz em{font-style:normal;font-weight:800;font-size:26px;margin-inline-start:6px}
.cd{align-self:flex-start;font-family:ui-monospace,monospace;background:#0007;padding:2px 12px;border-radius:99px;margin-top:6px;direction:ltr;font-size:13px}
.fly{position:fixed;z-index:200;width:22px;height:26px;background:var(--ac);clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,0 100%);pointer-events:none}
.cf{position:fixed;z-index:200;width:9px;height:14px;pointer-events:none}
.fc{transition:transform .2s}
#intro{position:fixed;inset:0;z-index:99;pointer-events:none}
#intro .pn{position:absolute;left:0;right:0;height:51%;background:#09090e;transition:transform 1s cubic-bezier(.77,0,.18,1)}
#intro .t{top:0}#intro .b{bottom:0}
#intro.go .t{transform:translateY(-101%)}#intro.go .b{transform:translateY(101%)}
#intro .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .45s,transform .6s}
#intro.go .ct{opacity:0;transform:scale(1.2)}
.pc{width:170px;height:4px;background:#23233a;border-radius:4px;overflow:hidden}.pc i{display:block;height:100%;width:0;background:#c6ff3d;animation:ld 2.1s .1s cubic-bezier(.6,0,.3,1) forwards}
@keyframes ld{to{width:100%}}
body:not(.ready) .hh>div:first-child>*,body:not(.ready) .fc{opacity:0}
body.ready .hh>div:first-child>*{animation:hin .9s cubic-bezier(.2,.8,.2,1) backwards}
.hh>div:first-child>:nth-child(2){animation-delay:.12s!important}.hh>div:first-child>:nth-child(3){animation-delay:.24s!important}.hh>div:first-child>:nth-child(4){animation-delay:.36s!important}.hh>div:first-child>:nth-child(5){animation-delay:.48s!important}
@keyframes hin{from{opacity:0;transform:translateY(46px) skewY(3deg)}}
.fc{transition:transform .2s,opacity .7s .5s}
#app.sw{animation:vin .55s cubic-bezier(.2,.8,.2,1)}@keyframes vin{from{opacity:0;transform:translateY(26px)}}
.btn:active,.ib:active{transform:scale(.95)}
.cf2{display:grid;gap:10px;margin:12px 0}
.cf2 input,.cf2 select,#cnote{width:100%;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);color:var(--fg);padding:11px 14px;font:inherit}
#cnote{margin:0;min-height:60px}
.shake{animation:shk .5s;border-color:var(--ac)!important}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#cerr{color:var(--ac);font-weight:600;margin:0 0 10px;min-height:0}
@media(max-width:640px){.bar2{gap:6px;height:60px}.brand{font-size:19px;gap:6px}.ib{height:38px;min-width:38px;padding:0 10px}#menuT,#waTop{display:none}.hh{padding-top:22px}.sh{margin-top:48px}.tick div{font-size:15px}.stack{height:290px}.fc{width:200px}.fc b{font-size:34px}}
#dr{position:fixed;inset:0;z-index:60;visibility:hidden;transition:visibility 0s .5s}#dr.open{visibility:visible;transition:none}
#dr .ov{position:absolute;inset:0;background:#000b;opacity:0;transition:.4s;backdrop-filter:blur(3px)}#dr.open .ov{opacity:1}
#dr .pnl{position:absolute;top:0;bottom:0;inset-inline-start:0;width:min(340px,88vw);background:var(--sf);border-inline-end:1.5px solid var(--fg);display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .5s cubic-bezier(.2,.9,.2,1)}
[dir=rtl] #dr .pnl{transform:translateX(102%)}
#dr.open .pnl,[dir=rtl] #dr.open .pnl{transform:none}
.mh2{display:flex;justify-content:space-between;align-items:center;padding:16px 18px}.brand2{font-weight:800;font-size:22px}
#drNav{flex:1;overflow:auto;padding:0 12px 10px}
#drNav h5{margin:16px 8px 4px;font-size:11px;letter-spacing:.14em;color:var(--mu);text-transform:uppercase}
#drNav a{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;font-weight:600;opacity:0}
#dr.open #drNav a{animation:up .45s forwards;animation-delay:calc(.12s + var(--i)*.04s)}
#drNav a i{width:38px;height:38px;border-radius:11px;background:var(--bg);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;color:var(--ac);direction:ltr;transition:.25s}
#drNav a:hover,#drNav a.on{background:var(--bg)}#drNav a.on i{background:var(--ac);color:var(--on)}#drNav a:hover i{transform:rotate(-8deg) scale(1.1)}
.mf{padding:14px 18px 22px;border-top:1px solid var(--ln);display:grid;gap:10px}.mrow{display:flex;gap:8px}
.gc .cv{position:relative;height:132px;overflow:hidden;display:grid;place-items:center;padding:14px;color:#fff;text-align:center}
.cvt{font-weight:800;font-size:19px;line-height:1.2;text-shadow:0 2px 8px #0008;position:relative}

.cv .pl{position:absolute;top:10px;inset-inline-start:10px;background:#000a;color:#fff}
.dis{position:absolute;top:8px;inset-inline-end:8px;z-index:2;background:var(--ac);color:var(--on);font-weight:800;font-size:15px;padding:2px 12px;border-radius:99px;animation:pls 1.4s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.18) rotate(-5deg)}}
.cv:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#fff5 50%,transparent 65%);transform:translateX(-130%);animation:shn 3.4s infinite}
@keyframes shn{60%,100%{transform:translateX(130%)}}
.gc .b{padding-top:12px}.gts{margin:8px 0}.cd2{display:inline-block;margin-top:8px;font:600 12px ui-monospace,monospace;color:var(--ac);direction:ltr}
.deals{padding-top:22px}.dh{display:flex;align-items:center;gap:10px;margin-bottom:12px}

.brand span{display:flex;flex-direction:column;line-height:1.05}.brand small{font-size:10px;letter-spacing:.22em;font-weight:600;color:var(--mu);text-transform:uppercase;margin-top:2px}
